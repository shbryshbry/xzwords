<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
<title>桌面轮播</title>
<style>
  html, body { margin: 0; padding: 0; background: transparent; height: 100%; overflow: hidden; user-select: none; }
  #card {
    margin: 10px; height: calc(100% - 20px); border-radius: 16px; position: relative; overflow: hidden;
    box-shadow: 0 12px 40px rgba(10, 20, 50, .4), 0 0 0 1px rgba(255,255,255,.12) inset;
    display: flex; flex-direction: column;
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    color: #fff;
  }
  .theme-green { background: linear-gradient(155deg, #0a9d68, #0fbf8f 60%, #0a8d60); }
  .theme-blue { background: linear-gradient(155deg, #2f5bd8, #5a8bff 60%, #3a63d8); }
  .theme-dark { background: linear-gradient(155deg, #1c2130, #3a4258 60%, #262c3e); }
  .theme-pink { background: linear-gradient(155deg, #c73e82, #ff7eb0 60%, #d84f8e); }
  /* 顶栏：拖动条 */
  #titlebar {
    height: 34px; flex: none; display: flex; align-items: center; gap: 6px;
    padding: 0 8px 0 12px; -webkit-app-region: drag;
    background: rgba(0,0,0,.14);
  }
  #titlebar .tag { font-size: 11px; opacity: .85; margin-right: auto; letter-spacing: 1px; }
  #titlebar button {
    border: none; background: rgba(255,255,255,.16); color: #fff; border-radius: 7px;
    width: 24px; height: 22px; cursor: pointer; font-size: 12px; line-height: 1;
    -webkit-app-region: no-drag; transition: background .15s;
  }
  #titlebar button:hover { background: rgba(255,255,255,.34); }
  #titlebar #c-close:hover { background: rgba(245,63,63,.85); }
  /* 内容区 */
  #body { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 6px 18px 0; -webkit-app-region: no-drag; }
  #word {
    font-size: 34px; font-weight: 800; letter-spacing: .5px; text-align: center;
    text-shadow: 0 2px 8px rgba(0,0,0,.18); cursor: pointer;
  }
  #word .pos {
    display: inline-block; vertical-align: 8px; margin-left: 8px;
    font-size: 11px; font-weight: 700; color: #fff;
    background: rgba(255,255,255,.22); border-radius: 999px; padding: 1px 9px;
    letter-spacing: 0; text-shadow: none;
  }
  #word.swap { animation: swapIn .35s ease; }
  @keyframes swapIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  #phon { font-size: 12.5px; opacity: .82; margin-top: 5px; text-align: center; min-height: 15px; }
  #trans { font-size: 15px; margin-top: 10px; line-height: 1.55; opacity: .97; text-align: center; min-height: 40px; }
  /* 底栏 */
  #foot {
    flex: none; display: flex; align-items: center; gap: 8px; -webkit-app-region: no-drag;
    padding: 9px 16px 10px; border-top: 1px solid rgba(255,255,255,.16);
  }
  .fbtn {
    border: none; background: rgba(255,255,255,.18); color: #fff; border-radius: 50%;
    width: 30px; height: 30px; cursor: pointer; font-size: 13px; padding: 0;
    display: inline-flex; align-items: center; justify-content: center;
    transition: background .15s, transform .1s;
  }
  .fbtn:hover { background: rgba(255,255,255,.36); transform: translateY(-1px); }
  #idx { margin-left: auto; font-size: 12px; opacity: .8; font-variant-numeric: tabular-nums; }
  #dots { display: flex; gap: 4px; margin-left: 10px; }
  #dots i { width: 5px; height: 5px; border-radius: 50%; background: rgba(255,255,255,.35); }
  #dots i.on { background: #fff; }
  #grip {
    position: fixed; right: 4px; bottom: 4px; width: 18px; height: 18px; z-index: 90;
    cursor: nwse-resize; color: rgba(255,255,255,.55);
    font-size: 14px; line-height: 15px; text-align: center; font-family: monospace;
  }
  #grip:hover { color: #fff; }
</style>
</head>
<body>
<div id="card" class="theme-green">
  <div id="titlebar">
    <span class="tag">🎠 桌面轮播</span>
    <button id="c-prev" title="上一个 (‹)">‹</button>
    <button id="c-next" title="下一个 (›)">›</button>
    <span style="flex:1"></span>
    <button id="c-close" title="关闭">✕</button>
  </div>
  <div id="body">
    <div id="word">…</div>
    <div id="phon"></div>
    <div id="trans"></div>
  </div>
  <div id="foot">
    <button class="fbtn" id="c-speak" title="发音">🔊</button>
    <div id="dots"></div>
    <span id="idx"></span>
  </div>
</div>
<div id="grip" title="拖动调整大小">⋰</div>
<script src="carousel.js"></script>
</body>
</html>
